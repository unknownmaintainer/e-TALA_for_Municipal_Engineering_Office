name: Keep Alive Render Web Service

on:
  schedule:
    # Runs every 12 minutes to prevent Render free-tier instance from sleeping (Render threshold: 15 min)
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  keep_alive_ping:
    name: Ping eTala Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        env:
          TARGET_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          URL="${TARGET_URL:-https://etala-carigara-meo.onrender.com/health/}"
          echo "Sending keep-alive ping to: $URL"
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo "000")
          echo "HTTP Response Status: $RESPONSE_CODE"
          if [ "$RESPONSE_CODE" -ge 200 ] && [ "$RESPONSE_CODE" -lt 400 ]; then
            echo "Service is awake and healthy."
          else
            echo "Warning: Received HTTP $RESPONSE_CODE (or request timed out during cold start)"
          fi
