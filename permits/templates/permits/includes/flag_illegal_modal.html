<!-- Create Report Modal -->
<div class="modal fade" id="flagIllegalModal" tabindex="-1" aria-labelledby="flagIllegalModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg" style="max-width: 680px;">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 14px; overflow: hidden;">
            
            <!-- Header -->
            <div class="modal-header border-0 px-4 pt-4 pb-0" style="background: #fff;">
                <div class="d-flex align-items-center gap-2">
                    <div class="d-flex align-items-center justify-content-center" style="width: 36px; height: 36px; background: #fee2e2; border-radius: 10px;">
                        <i class="fa-solid fa-plus" style="font-size: 14px; color: #dc2626;"></i>
                    </div>
                    <div>
                        <h5 class="modal-title fw-bold mb-0" id="flagIllegalModalLabel" style="font-size: 1.05rem; color: #0f172a;">Create Report</h5>
                        <p class="mb-0" style="font-size: 0.75rem; color: #94a3b8;">Report a violation or unpermitted structure</p>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="font-size: 0.7rem;"></button>
            </div>

            <form method="POST" action="{% url 'flag_illegal_construction' %}" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="modal-body px-4 pt-3 pb-4">
                    <div class="row g-3">

                        <!-- Structure / Project -->
                        <div class="col-12">
                            <label class="cr-label">Structure / Project Name <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control cr-field" placeholder="e.g. 2-Storey Residential Building" required>
                        </div>

                        <!-- Location Row -->
                        <div class="col-md-6">
                            <label class="cr-label">Barangay <span class="text-danger">*</span></label>
                            <select name="barangay" class="form-select cr-field" required>
                                <option value="" disabled selected>Select barangay...</option>
                                {% for b in barangays %}
                                <option value="{{ b.barangay_id }}">{{ b.barangay_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="cr-label">Street / Landmark</label>
                            <input type="text" name="location_address" class="form-control cr-field" placeholder="e.g. Purok 3, near plaza">
                        </div>

                        <!-- Violation Type & Date -->
                        <div class="col-md-6">
                            <label class="cr-label">Type of Violation <span class="text-danger">*</span></label>
                            <select name="violation_type" class="form-select cr-field" required>
                                <option value="Unpermitted Construction" selected>Unpermitted Construction</option>
                                <option value="No Building Permit">No Building Permit</option>
                                <option value="No Occupancy Permit">No Occupancy Permit</option>
                                <option value="Setback Violation">Setback Violation</option>
                                <option value="Non-compliance with Plans">Non-compliance with Plans</option>
                                <option value="Safety / Structural Hazard">Safety / Structural Hazard</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="cr-label">Date Reported <span class="text-danger">*</span></label>
                            <input type="date" name="date_discovered" class="form-control cr-field" value="{% now 'Y-m-d' %}" required>
                        </div>

                        <!-- Description -->
                        <div class="col-12">
                            <label class="cr-label">Description</label>
                            <textarea name="description" class="form-control cr-field" rows="2" placeholder="Briefly describe the violation or structure observed..."></textarea>
                        </div>

                        <!-- Photo & Remarks side by side -->
                        <div class="col-md-6">
                            <label class="cr-label">Supporting Photo <span style="color: #94a3b8; font-weight: 400;">(Optional)</span></label>
                            <div class="cr-file-box">
                                <input type="file" name="photo" accept="image/*,.pdf" id="flagPhotoInput" class="cr-file-input">
                                <div class="cr-file-label">
                                    <i data-lucide="upload" style="width: 14px; height: 14px; color: #94a3b8; flex-shrink: 0;"></i>
                                    <span id="flagPhotoName" class="text-truncate" style="color: #94a3b8; font-size: 0.8rem;">Choose file...</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="cr-label">Remarks <span style="color: #94a3b8; font-weight: 400;">(Optional)</span></label>
                            <input type="text" name="remarks" class="form-control cr-field" placeholder="Any additional notes...">
                        </div>

                    </div>
                </div>

                <!-- Footer -->
                <div class="modal-footer border-top px-4 py-3" style="background: #f8fafc; border-color: #f1f5f9 !important;">
                    <button type="button" class="btn px-3 py-2 fw-medium" data-bs-dismiss="modal" style="border-radius: 8px; font-size: 0.82rem; color: #64748b; background: #e2e8f0; border: none;">
                        Cancel
                    </button>
                    <button type="submit" class="btn text-white px-4 py-2 fw-semibold d-inline-flex align-items-center gap-2" style="border-radius: 8px; font-size: 0.82rem; background: #dc2626; border: none;">
                        <i data-lucide="send" style="width: 14px; height: 14px;"></i> Submit Report
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
/* ── Create Report Modal ── */
.cr-label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: #374151;
    margin-bottom: 5px;
}
.cr-field {
    border-radius: 8px !important;
    padding: 0.5rem 0.75rem !important;
    font-size: 0.82rem !important;
    border: 1px solid #e2e8f0 !important;
    background: #fff !important;
    color: #0f172a !important;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.cr-field:focus {
    border-color: #dc2626 !important;
    box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.08) !important;
}
.cr-field::placeholder { color: #b0b8c4 !important; }
.cr-field option {
    background: #fff !important;
    color: #0f172a !important;
}

/* File upload */
.cr-file-box {
    position: relative;
    border: 1px dashed #d1d5db;
    border-radius: 8px;
    background: #fafbfc;
    height: 38px;
    overflow: hidden;
    transition: border-color 0.15s ease;
}
.cr-file-box:hover { border-color: #dc2626; background: #fef2f2; }
.cr-file-input {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0; cursor: pointer; z-index: 2;
}
.cr-file-label {
    display: flex; align-items: center; gap: 8px;
    height: 100%; padding: 0 12px;
    cursor: pointer;
}

/* Dark mode */
.dark-mode .cr-label,
[data-bs-theme="dark"] .cr-label { color: #cbd5e1; }
.dark-mode .cr-field,
[data-bs-theme="dark"] .cr-field {
    background: #0f172a !important;
    border-color: #334155 !important;
    color: #f1f5f9 !important;
}
.dark-mode .cr-field::placeholder,
[data-bs-theme="dark"] .cr-field::placeholder { color: #64748b !important; }
.dark-mode .cr-field option,
[data-bs-theme="dark"] .cr-field option {
    background: #1e293b !important;
    color: #f1f5f9 !important;
}
.dark-mode .cr-file-box,
[data-bs-theme="dark"] .cr-file-box {
    background: #0f172a !important;
    border-color: #334155 !important;
}
.dark-mode .cr-file-box:hover,
[data-bs-theme="dark"] .cr-file-box:hover {
    border-color: #dc2626 !important;
    background: #1a0f0f !important;
}
.dark-mode #flagIllegalModal .modal-content,
[data-bs-theme="dark"] #flagIllegalModal .modal-content {
    background: #1e293b !important;
}
.dark-mode #flagIllegalModal .modal-header,
[data-bs-theme="dark"] #flagIllegalModal .modal-header {
    background: #1e293b !important;
}
.dark-mode #flagIllegalModal .modal-header h5,
[data-bs-theme="dark"] #flagIllegalModal .modal-header h5 { color: #f1f5f9 !important; }
.dark-mode #flagIllegalModal .modal-header p,
[data-bs-theme="dark"] #flagIllegalModal .modal-header p { color: #64748b !important; }
.dark-mode #flagIllegalModal .modal-footer,
[data-bs-theme="dark"] #flagIllegalModal .modal-footer {
    background: #0f172a !important;
    border-color: #1e293b !important;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const m = document.getElementById('flagIllegalModal');
    if (m && m.parentElement !== document.body) {
        document.body.appendChild(m);
    }

    const photoInput = document.getElementById('flagPhotoInput');
    const photoName = document.getElementById('flagPhotoName');
    if (photoInput && photoName) {
        photoInput.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                photoName.textContent = this.files[0].name;
                photoName.style.color = '#0f172a';
                photoName.style.fontWeight = '500';
            } else {
                photoName.textContent = 'Choose file...';
                photoName.style.color = '#94a3b8';
                photoName.style.fontWeight = '';
            }
        });
    }
});
</script>
