<!-- ══ LGU BUILDING OFFICIAL VIOLATION & INSPECTION REPORT MODAL ══ -->
<div class="modal fade" id="flagIllegalModal" tabindex="-1" aria-labelledby="flagIllegalModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 540px;">
        <div class="modal-content border-0 shadow-xl" style="border-radius: 16px; overflow: hidden;">

            <!-- Modal Header -->
            <div class="modal-header border-bottom px-4 py-2.5 bg-white d-flex align-items-center justify-content-between flex-shrink-0">
                <div class="d-flex align-items-center gap-2.5">
                    <div class="d-flex align-items-center justify-content-center flex-shrink-0"
                        style="width: 34px; height: 34px; background: rgba(220, 38, 38, 0.12); border: 1px solid rgba(220, 38, 38, 0.25); border-radius: 9px; color: #dc2626;">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 14px;"></i>
                    </div>
                    <div>
                        <h5 class="modal-title fw-bold mb-0 text-dark" id="flagIllegalModalLabel"
                            style="font-size: 0.96rem; letter-spacing: -0.01em;">
                            Report Violation
                        </h5>
                        <p class="mb-0 text-muted" style="font-size: 0.70rem;">
                            Record illegal or unpermitted construction incident
                        </p>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
                    style="font-size: 0.70rem;"></button>
            </div>

            <form method="POST" action="{% url 'flag_illegal_construction' %}" enctype="multipart/form-data"
                id="flagIllegalForm" class="d-flex flex-column" style="margin-bottom: 0;">
                {% csrf_token %}

                <div class="modal-body px-4 py-2.5" style="overflow-y: hidden;">

                    <!-- Section Header -->
                    <div class="d-flex align-items-center gap-1.5 mb-2 pb-1 border-bottom violation-section-header">
                        <i class="fa-solid fa-triangle-exclamation text-danger" style="font-size: 10px;"></i>
                        <span class="fw-bold" style="font-size: 0.68rem; letter-spacing: 0.5px; text-transform: uppercase; color: #dc2626;">Violation Details</span>
                    </div>

                    <div class="row g-2.5">
                        <!-- Row 1: Structure/Incident Name & Barangay -->
                        <div class="col-md-6">
                            <label class="cr-label">Structure / Incident Name <span class="text-danger fw-bold">*</span></label>
                            <input type="text" name="title" class="form-control cr-field"
                                placeholder="e.g. 2-Storey Commercial Building" maxlength="80" required>
                        </div>
                        <div class="col-md-6">
                            <label class="cr-label">Barangay <span class="text-danger fw-bold">*</span></label>
                            <select name="barangay" class="form-select cr-field" required>
                                <option value="" disabled selected>— Select Barangay —</option>
                                {% for b in barangays %}
                                <option value="{{ b.barangay_id }}">{{ b.barangay_name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Row 2: Applicant / Owner & Violation Type -->
                        <div class="col-md-6">
                            <label class="cr-label">Applicant / Property Owner</label>
                            <input type="text" name="applicant_name" class="form-control cr-field"
                                placeholder="e.g. Juan Dela Cruz" maxlength="60">
                        </div>
                        <div class="col-md-6">
                            <label class="cr-label">Violation Type <span class="text-danger fw-bold">*</span></label>
                            <select name="violation_type" class="form-select cr-field" required>
                                <option value="Unpermitted Construction" selected>Unpermitted Construction</option>
                                <option value="Deviation from Approved Plans">Deviation from Approved Plans</option>
                                <option value="Setback & Right-of-Way Encroachment">Setback / ROW Encroachment</option>
                                <option value="Dangerous & Ruinous Structure">Dangerous / Ruinous Structure</option>
                                <option value="No Occupancy Permit">No Occupancy Permit</option>
                                <option value="Other Non-compliance">Other Non-compliance</option>
                            </select>
                        </div>

                        <!-- Row 3: Date Discovered / Inspected & Building Type -->
                        <div class="col-md-6">
                            <label class="cr-label">Date Discovered / Inspected <span class="text-danger fw-bold">*</span></label>
                            <input type="date" name="date_discovered" class="form-control cr-field"
                                value="{% now 'Y-m-d' %}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="cr-label">Building Type</label>
                            <select name="structure_type" class="form-select cr-field">
                                <option value="Residential" selected>Residential</option>
                                <option value="Commercial">Commercial</option>
                                <option value="Industrial">Industrial</option>
                                <option value="Institutional">Institutional</option>
                                <option value="Agricultural">Agricultural</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>

                        <!-- Row 4: Attach Photo / Notice Dropzone -->
                        <div class="col-12">
                            <label class="cr-label">Attach Photo or Notice <span class="text-muted fw-normal">(Optional)</span></label>
                            <div class="cr-dropzone-box" id="flagPhotoDropzone">
                                <input type="file" name="photo" accept="image/*,.pdf" id="flagPhotoInput" class="cr-dropzone-input">
                                
                                <!-- Empty State -->
                                <div id="flagPhotoEmptyState" class="cr-dropzone-empty">
                                    <div class="cr-dropzone-icon">
                                        <i class="fa-solid fa-cloud-arrow-up"></i>
                                    </div>
                                    <div class="cr-dropzone-text">
                                        <span class="cr-dropzone-main">Choose site photo or Notice of Violation</span>
                                        <span class="cr-dropzone-sub">PNG, JPG, PDF up to 25 MB</span>
                                    </div>
                                </div>

                                <!-- Selected File State -->
                                <div id="flagPhotoSelectedState" class="cr-dropzone-selected d-none">
                                    <div class="d-flex align-items-center gap-2 overflow-hidden">
                                        <div class="cr-file-icon-box">
                                            <i class="fa-solid fa-file-image" id="flagPhotoTypeIcon"></i>
                                        </div>
                                        <div class="overflow-hidden text-start">
                                            <div class="cr-file-name text-truncate" id="flagPhotoSelectedName"></div>
                                            <div class="d-flex align-items-center gap-2">
                                                <span class="cr-file-size text-muted" id="flagPhotoSelectedSize"></span>
                                                <span class="badge bg-success-subtle text-success border border-success-subtle" style="font-size: 0.62rem; padding: 1px 5px;">Ready to upload</span>
                                            </div>
                                        </div>
                                    </div>
                                    <button type="button" class="btn-clear-file" id="flagPhotoClearBtn" title="Remove file">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Row 5: Notes / Observations -->
                        <div class="col-12">
                            <label class="cr-label">Description / Remarks <span class="text-muted fw-normal">(Optional)</span></label>
                            <textarea name="description" class="form-control cr-field char-counted" rows="2"
                                maxlength="250"
                                placeholder="Location details, ongoing works, or notes..." style="height: auto; min-height: 42px; resize: none;"></textarea>
                            <div class="text-end text-muted small mt-0.5 char-counter-lbl" style="font-size: 0.66rem;">0 / 250 characters</div>
                        </div>
                    </div>

                </div>

                <!-- Modal Footer -->
                <div class="modal-footer border-top px-4 py-2 bg-light d-flex align-items-center justify-content-end gap-2 flex-shrink-0">
                    <button type="button" class="btn btn-light border px-3.5 py-1.5 fw-semibold text-secondary"
                        data-bs-dismiss="modal" style="border-radius: 8px; font-size: 0.80rem; height: 34px;">
                        Cancel
                    </button>
                    <button type="submit"
                        class="btn text-white px-3.5 py-1.5 fw-semibold d-inline-flex align-items-center gap-1.5"
                        style="border-radius: 8px; font-size: 0.80rem; height: 34px; background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); border: none; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.22);">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 11px;"></i>
                        <span>Report Violation</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .cr-label {
        display: block;
        font-size: 0.78rem;
        font-weight: 600;
        color: #334155;
        margin-bottom: 3px;
    }

    .cr-field {
        border-radius: 8px !important;
        padding: 6px 11px !important;
        font-size: 0.84rem !important;
        height: 36px;
        border: 1px solid #cbd5e1 !important;
        background-color: #ffffff !important;
        color: #0f172a !important;
        transition: all 0.15s ease;
    }

    select.cr-field,
    select.form-select {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23475569' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e") !important;
        background-repeat: no-repeat !important;
        background-position: right 10px center !important;
        background-size: 13px 9px !important;
        padding-right: 30px !important;
        appearance: none !important;
        -webkit-appearance: none !important;
    }

    textarea.cr-field {
        height: auto !important;
        min-height: 48px !important;
        padding: 6px 11px !important;
    }

    .cr-field:focus {
        border-color: #0284c7 !important;
        box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.14) !important;
        outline: none !important;
    }

    .cr-field::placeholder {
        color: #94a3b8 !important;
    }

    .cr-field option {
        background: #ffffff !important;
        color: #0f172a !important;
    }

    /* Modern Compact Dropzone */
    .cr-dropzone-box {
        position: relative;
        border: 1.5px dashed #cbd5e1;
        border-radius: 8px;
        background: #f8fafc;
        padding: 6px 10px;
        min-height: 44px;
        display: flex;
        align-items: center;
        transition: all 0.15s ease;
        cursor: pointer;
    }

    .cr-dropzone-box:hover {
        border-color: #0284c7;
        background: #f0f9ff;
    }

    .cr-dropzone-box.has-file {
        border-style: solid;
        border-color: #cbd5e1;
        background: #ffffff;
        cursor: default;
    }

    .cr-dropzone-input {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
        z-index: 2;
    }

    .cr-dropzone-box.has-file .cr-dropzone-input {
        display: none;
    }

    .cr-dropzone-empty {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        pointer-events: none;
    }

    .cr-dropzone-icon {
        width: 28px;
        height: 28px;
        background: #fee2e2;
        color: #dc2626;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        flex-shrink: 0;
    }

    .cr-dropzone-text {
        display: flex;
        flex-direction: column;
        text-align: left;
    }

    .cr-dropzone-main {
        font-size: 0.77rem;
        font-weight: 600;
        color: #1e293b;
        line-height: 1.2;
    }

    .cr-dropzone-sub {
        font-size: 0.67rem;
        color: #64748b;
    }

    .cr-dropzone-selected {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
    }

    .cr-file-icon-box {
        width: 28px;
        height: 28px;
        background: #fee2e2;
        color: #dc2626;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        flex-shrink: 0;
    }

    .cr-file-name {
        font-size: 0.77rem;
        font-weight: 600;
        color: #0f172a;
        max-width: 320px;
    }

    .cr-file-size {
        font-size: 0.67rem;
    }

    .btn-clear-file {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1px solid #e2e8f0;
        background: #ffffff;
        color: #ef4444;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        cursor: pointer;
        transition: all 0.15s ease;
        z-index: 5;
    }

    .btn-clear-file:hover {
        background: #fee2e2;
        border-color: #fecaca;
    }

    /* Dark Mode */
    .dark-mode .cr-label,
    [data-bs-theme="dark"] .cr-label {
        color: #cbd5e1;
    }

    .dark-mode .cr-field,
    [data-bs-theme="dark"] .cr-field {
        background-color: #0f172a !important;
        border-color: #334155 !important;
        color: #f1f5f9 !important;
    }

    .dark-mode .cr-field:focus,
    [data-bs-theme="dark"] .cr-field:focus {
        border-color: #38bdf8 !important;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2) !important;
    }

    .dark-mode select.cr-field,
    .dark-mode select.form-select,
    [data-bs-theme="dark"] select.cr-field,
    [data-bs-theme="dark"] select.form-select {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e") !important;
    }

    .dark-mode .cr-field::placeholder,
    [data-bs-theme="dark"] .cr-field::placeholder {
        color: #64748b !important;
    }

    .dark-mode .cr-field option,
    [data-bs-theme="dark"] .cr-field option {
        background: #1e293b !important;
        color: #f1f5f9 !important;
    }

    .dark-mode .cr-dropzone-box,
    [data-bs-theme="dark"] .cr-dropzone-box {
        background: #0f172a !important;
        border-color: #334155 !important;
    }

    .dark-mode .cr-dropzone-box:hover,
    [data-bs-theme="dark"] .cr-dropzone-box:hover {
        border-color: #38bdf8 !important;
        background: rgba(56, 189, 248, 0.08) !important;
    }

    .dark-mode .cr-dropzone-box.has-file,
    [data-bs-theme="dark"] .cr-dropzone-box.has-file {
        background: #1e293b !important;
        border-color: #334155 !important;
    }

    .dark-mode .cr-dropzone-icon,
    [data-bs-theme="dark"] .cr-dropzone-icon {
        background: rgba(220, 38, 38, 0.2);
        color: #f87171;
    }

    .dark-mode .cr-dropzone-main,
    [data-bs-theme="dark"] .cr-dropzone-main {
        color: #f1f5f9;
    }

    .dark-mode .cr-dropzone-sub,
    [data-bs-theme="dark"] .cr-dropzone-sub {
        color: #94a3b8;
    }

    .dark-mode .cr-file-icon-box,
    [data-bs-theme="dark"] .cr-file-icon-box {
        background: rgba(220, 38, 38, 0.2);
        color: #f87171;
    }

    .dark-mode .cr-file-name,
    [data-bs-theme="dark"] .cr-file-name {
        color: #f8fafc;
    }

    .dark-mode .btn-clear-file,
    [data-bs-theme="dark"] .btn-clear-file {
        background: #0f172a;
        border-color: #334155;
        color: #f87171;
    }

    .dark-mode .btn-clear-file:hover,
    [data-bs-theme="dark"] .btn-clear-file:hover {
        background: rgba(220, 38, 38, 0.2);
    }

    .dark-mode #flagIllegalModal .modal-content,
    [data-bs-theme="dark"] #flagIllegalModal .modal-content {
        background: #1e293b !important;
    }

    .dark-mode #flagIllegalModal .modal-header,
    [data-bs-theme="dark"] #flagIllegalModal .modal-header {
        background: #1e293b !important;
        border-color: #334155 !important;
    }

    .dark-mode #flagIllegalModal .modal-header h5,
    [data-bs-theme="dark"] #flagIllegalModal .modal-header h5 {
        color: #f1f5f9 !important;
    }

    .dark-mode #flagIllegalModal .modal-footer,
    [data-bs-theme="dark"] #flagIllegalModal .modal-footer {
        background: #0f172a !important;
        border-color: #334155 !important;
    }

    .dark-mode .violation-section-header {
        border-bottom-color: #334155 !important;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const modalEl = document.getElementById('flagIllegalModal');
        if (modalEl && modalEl.parentElement !== document.body) {
            document.body.appendChild(modalEl);
        }

        const photoInput = document.getElementById('flagPhotoInput');
        const dropzone = document.getElementById('flagPhotoDropzone');
        const emptyState = document.getElementById('flagPhotoEmptyState');
        const selectedState = document.getElementById('flagPhotoSelectedState');
        const selectedName = document.getElementById('flagPhotoSelectedName');
        const selectedSize = document.getElementById('flagPhotoSelectedSize');
        const typeIcon = document.getElementById('flagPhotoTypeIcon');
        const clearBtn = document.getElementById('flagPhotoClearBtn');

        function updateDropzoneUI() {
            if (photoInput && photoInput.files && photoInput.files.length > 0) {
                const f = photoInput.files[0];
                const sz = (f.size / (1024 * 1024)).toFixed(2);
                selectedName.textContent = f.name;
                selectedSize.textContent = `${sz} MB`;

                // Update icon according to type
                if (f.type.includes('pdf')) {
                    typeIcon.className = 'fa-solid fa-file-pdf';
                } else if (f.type.includes('image')) {
                    typeIcon.className = 'fa-solid fa-file-image';
                } else {
                    typeIcon.className = 'fa-solid fa-file-lines';
                }

                emptyState.classList.add('d-none');
                selectedState.classList.remove('d-none');
                dropzone.classList.add('has-file');
            } else {
                emptyState.classList.remove('d-none');
                selectedState.classList.add('d-none');
                dropzone.classList.remove('has-file');
                if (photoInput) photoInput.value = '';
            }
        }

        if (photoInput) {
            photoInput.addEventListener('change', updateDropzoneUI);
        }

        if (clearBtn) {
            clearBtn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                if (photoInput) photoInput.value = '';
                updateDropzoneUI();
            });
        }

        // Character counter for textarea
        const charCounted = document.querySelectorAll('.char-counted');
        charCounted.forEach(area => {
            area.addEventListener('input', function () {
                const counter = this.parentElement.querySelector('.char-counter-lbl');
                if (counter) {
                    const max = this.getAttribute('maxlength') || 250;
                    counter.textContent = `${this.value.length} / ${max} characters`;
                }
            });
        });
    });
</script>
