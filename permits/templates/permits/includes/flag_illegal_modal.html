<!-- Flag Illegal Construction Modal -->
<div class="modal fade" id="flagIllegalModal" tabindex="-1" aria-labelledby="flagIllegalModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl" style="max-width: 1000px;">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 16px; overflow: hidden; background: #ffffff;">
            
            <!-- Modal Header -->
            <div class="modal-header text-white" style="background: linear-gradient(135deg, #991b1b 0%, #dc2626 100%); padding: 18px 28px; border-bottom: 1px solid #ef4444;">
                <div class="d-flex align-items-center gap-3">
                    <div class="rounded-circle d-flex align-items-center justify-content-center" style="width: 42px; height: 42px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2);">
                        <i data-lucide="shield-alert" style="width: 22px; height: 22px; color: #ffffff;"></i>
                    </div>
                    <div>
                        <h5 class="modal-title fw-bold text-white mb-0" id="flagIllegalModalLabel" style="font-size: 1.1rem; letter-spacing: -0.01em;">
                            Flag Unpermitted Building / Structure
                        </h5>
                        <div class="small mt-0.5" style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.85);">
                            Municipal Engineering Office — Building Code Enforcement (P.D. 1096 Sec. 301)
                        </div>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form method="POST" action="{% url 'flag_illegal_construction' %}" enctype="multipart/form-data" class="d-flex flex-column flex-grow-1">
                {% csrf_token %}
                
                <!-- Modal Body -->
                <div class="modal-body p-4 p-md-4.5" style="background: #ffffff;">
                    <div class="row g-3">
                        
                        <!-- Property Identification Section -->
                        <div class="col-12">
                            <div class="d-flex align-items-center gap-2 pb-2 border-bottom mb-1" style="border-color: #e2e8f0 !important;">
                                <span class="badge rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 22px; height: 22px; background: #fee2e2; color: #dc2626; font-weight: 700; font-size: 0.72rem;">1</span>
                                <h6 class="fw-bold mb-0 text-dark" style="font-size: 0.92rem;">Property &amp; Structure Identification</h6>
                            </div>
                        </div>

                        <div class="col-md-7">
                            <label class="form-label fw-semibold small text-dark mb-1">
                                Property Owner / Title <span class="text-danger">*</span>
                            </label>
                            <input type="text" name="title" class="form-control form-control-sm obo-input" placeholder="e.g., Juan Dela Cruz / Unpermitted Residential Store" required>
                        </div>

                        <div class="col-md-5">
                            <label class="form-label fw-semibold small text-dark mb-1">
                                NOV / Order No. <span class="text-muted fw-normal">(Optional)</span>
                            </label>
                            <input type="text" name="nov_number" class="form-control form-control-sm obo-input" placeholder="e.g. NOV-2026-001">
                        </div>

                        <!-- Location & Details Section -->
                        <div class="col-12 mt-3">
                            <div class="d-flex align-items-center gap-2 pb-2 border-bottom mb-1" style="border-color: #e2e8f0 !important;">
                                <span class="badge rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 22px; height: 22px; background: #fee2e2; color: #dc2626; font-weight: 700; font-size: 0.72rem;">2</span>
                                <h6 class="fw-bold mb-0 text-dark" style="font-size: 0.92rem;">Location &amp; Inspection Details</h6>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold small text-dark mb-1">
                                Barangay Location <span class="text-danger">*</span>
                            </label>
                            <select name="barangay" class="form-select form-select-sm obo-select" required>
                                <option value="" disabled selected>Select Barangay...</option>
                                {% for b in barangays %}
                                <option value="{{ b.barangay_id }}">{{ b.barangay_name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold small text-dark mb-1">
                                Date Discovered / Inspected <span class="text-danger">*</span>
                            </label>
                            <input type="date" name="date_discovered" class="form-control form-control-sm obo-input" value="{% now 'Y-m-d' %}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold small text-dark mb-1">
                                Enforcement Status
                            </label>
                            <select name="illegal_compliance_status" class="form-select form-select-sm obo-select">
                                <option value="unresolved" selected>Unresolved (Notice Issued)</option>
                                <option value="pending_permit">Building Permit Filed</option>
                                <option value="resolved">Regularized / Permit Issued</option>
                            </select>
                        </div>

                        <div class="col-md-7">
                            <label class="form-label fw-semibold small text-dark mb-1">
                                Site Address / Landmark Details
                            </label>
                            <input type="text" name="location_address" class="form-control form-control-sm obo-input" placeholder="Street, Sitio, or Landmark">
                        </div>

                        <!-- User-Friendly Custom Photo Upload Control -->
                        <div class="col-md-5">
                            <label class="form-label fw-semibold small text-dark mb-1">
                                Photo Evidence <span class="text-muted fw-normal">(Optional)</span>
                            </label>
                            <div class="obo-file-upload-box">
                                <input type="file" name="photo" accept="image/*" id="flagPhotoInput" class="obo-file-input">
                                <div class="obo-file-upload-label d-flex align-items-center justify-content-between px-3 py-1.5">
                                    <span id="flagPhotoName" class="text-truncate small text-muted">Choose photo or drag file here...</span>
                                    <span class="btn btn-light border px-2 py-0.5 small text-dark fw-medium flex-shrink-0 ms-2" style="font-size: 0.75rem; border-radius: 6px;">Browse</span>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Modal Footer -->
                <div class="modal-footer px-4 py-3 border-top d-flex align-items-center justify-content-between flex-shrink-0" style="background: #f8fafc; border-color: #e2e8f0 !important;">
                    <button type="button" class="btn btn-secondary px-4 py-2 fw-semibold" data-bs-dismiss="modal" style="border-radius: 8px; font-size: 0.85rem; background: #64748b; border: none;">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-danger px-4 py-2 fw-semibold d-inline-flex align-items-center gap-1.5" style="border-radius: 8px; font-size: 0.85rem; background: #dc2626; border-color: #dc2626;">
                        <i data-lucide="shield-alert" style="width: 16px; height: 16px;"></i> Flag Illegal Construction
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
/* Custom Styling for OBO Form Controls & Select Options */
.obo-input,
.obo-select {
    border-radius: 8px !important;
    padding: 0.45rem 0.75rem !important;
    font-size: 0.84rem !important;
    border: 1px solid var(--border-default, #cbd5e1) !important;
    background-color: var(--card-bg, #ffffff) !important;
    color: var(--gray-800, #0f172a) !important;
}

.obo-input:focus,
.obo-select:focus {
    border-color: #dc2626 !important;
    box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15) !important;
}

/* Explicit styling for select options */
.obo-select option {
    background-color: #ffffff !important;
    color: #0f172a !important;
    padding: 8px 12px !important;
}

.dark-mode .obo-select option,
[data-bs-theme="dark"] .obo-select option {
    background-color: #1e293b !important;
    color: #f8fafc !important;
}

.dark-mode .obo-input,
.dark-mode .obo-select,
[data-bs-theme="dark"] .obo-input,
[data-bs-theme="dark"] .obo-select {
    background-color: #0f172a !important;
    border-color: #334155 !important;
    color: #f8fafc !important;
}

.dark-mode .obo-input::placeholder,
[data-bs-theme="dark"] .obo-input::placeholder {
    color: #64748b !important;
}

/* User-Friendly Photo Upload Control */
.obo-file-upload-box {
    position: relative;
    border: 1px solid var(--border-default, #cbd5e1);
    border-radius: 8px;
    background-color: var(--card-bg, #ffffff);
    height: 36px;
    overflow: hidden;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.obo-file-upload-box:hover,
.obo-file-upload-box:focus-within {
    border-color: #dc2626 !important;
}

.obo-file-input {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    z-index: 2;
}

.obo-file-upload-label {
    height: 100%;
    cursor: pointer;
    background: transparent;
}

.dark-mode .obo-file-upload-box,
[data-bs-theme="dark"] .obo-file-upload-box {
    background-color: #0f172a !important;
    border-color: #334155 !important;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const m = document.getElementById('flagIllegalModal');
    if (m && m.parentElement !== document.body) {
        document.body.appendChild(m);
    }

    const photoInput = document.getElementById('flagPhotoInput');
    const photoName = document.getElementById('flagPhotoName');
    if (photoInput && photoName) {
        photoInput.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                photoName.textContent = this.files[0].name;
                photoName.style.color = 'var(--gray-800, #0f172a)';
                photoName.style.fontWeight = '500';
            } else {
                photoName.textContent = 'Choose photo or drag file here...';
                photoName.style.color = '';
                photoName.style.fontWeight = '';
            }
        });
    }
});
</script>
