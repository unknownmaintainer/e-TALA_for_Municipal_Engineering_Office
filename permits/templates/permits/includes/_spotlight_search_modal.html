<div id="spotlightSearchModal" class="spotlight-search-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Global Search">
    <div class="spotlight-backdrop" onclick="closeSpotlightSearch()"></div>
    
    <div class="spotlight-dialog">
        <!-- Search Input Bar -->
        <div class="spotlight-input-wrapper">
            <div class="spotlight-icon-wrap">
                <i class="fa-solid fa-magnifying-glass spotlight-search-icon"></i>
            </div>
            <input type="text"
                   id="spotlightSearchInput"
                   class="spotlight-input"
                   placeholder="Search permit #, applicant, project, or barangay..."
                   autocomplete="off"
                   spellcheck="false"
                   aria-autocomplete="list"
                   aria-controls="spotlightResultsContainer">
            
            <div id="spotlightSpinner" class="spotlight-spinner d-none" title="Searching...">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
            </div>
            
            <!-- Clear Button -->
            <button type="button" id="spotlightClearBtn" class="spotlight-clear-btn d-none" onclick="clearSpotlightSearch()" title="Clear search" aria-label="Clear Search">
                <i class="fa-solid fa-circle-xmark"></i>
            </button>

            <!-- Close ESC Button -->
            <button type="button" class="spotlight-close-btn" onclick="closeSpotlightSearch()" title="Close search (Esc)" aria-label="Close search">
                <span class="spotlight-kbd-badge">ESC</span>
            </button>
        </div>

        <!-- Results / Suggestions Container -->
        <div class="spotlight-body custom-scrollbar" id="spotlightResultsContainer">
            <!-- Initial State (Clean, Simple Hint) -->
            <div id="spotlightInitialState" class="spotlight-state-view py-4 text-center">
                <div class="spotlight-initial-hint">
                    <i class="fa-solid fa-magnifying-glass me-1.5 spotlight-hint-icon"></i>
                    <span>Type to search permits, applicants, projects, or barangays...</span>
                </div>
            </div>

            <!-- Dynamic Search Results List -->
            <div id="spotlightResultsList" class="spotlight-results-list d-none"></div>

            <!-- Empty State -->
            <div id="spotlightEmptyState" class="spotlight-state-view d-none py-4 text-center">
                <i class="fa-regular fa-folder-open spotlight-empty-folder-icon mb-1.5 d-block"></i>

                <div class="spotlight-empty-sub mt-0.5">Check your spelling or try searching by permit #, applicant name, or barangay.</div>
            </div>
        </div>

        <!-- Spotlight Footer: Minimal & Clean -->
        <div class="spotlight-footer d-flex align-items-center justify-content-between">
            <div class="spotlight-footer-hint text-muted" style="font-size: 0.72rem;">
                <span>Press <kbd>ESC</kbd> to close</span>
            </div>

// ─── SPOTLIGHT SEARCH JAVASCRIPT LOGIC ─────────────────────────────────
let spotlightDebounceTimer = null;
let spotlightSelectedIndex = -1;
let currentSpotlightState = 'initial'; // 'initial' | 'results' | 'empty'

function openSpotlightSearch() {
    const modal = document.getElementById('spotlightSearchModal');
    const input = document.getElementById('spotlightSearchInput');
    if (!modal || !input) return;

    modal.classList.add('is-active');
    modal.setAttribute('aria-hidden', 'false');

    // Background scroll lock
    document.documentElement.classList.add('modal-open');
    document.body.classList.add('modal-open');
    document.body.style.overflow = 'hidden';
    document.documentElement.style.overflow = 'hidden';

    // Search query persistence across page navigation
    const savedQuery = sessionStorage.getItem('spotlight_last_query') || input.value || '';
    if (savedQuery && savedQuery.trim().length > 0) {
        input.value = savedQuery;
        spotlightSelectedIndex = -1;
        toggleClearButton(true);
        updateBrowseLink(savedQuery);
        // Dispatch input to load the active results automatically
        input.dispatchEvent(new Event('input', { bubbles: true }));
        setTimeout(() => {
            input.focus();
            input.select(); // Auto-select text for easy overwrite or instant keyboard navigation
        }, 60);
    } else {
        input.value = '';
        spotlightSelectedIndex = -1;
        toggleClearButton(false);
        updateBrowseLink('');
        showSpotlightState('initial');
        setTimeout(() => input.focus(), 60);
    }
}

function closeSpotlightSearch() {
    const modal = document.getElementById('spotlightSearchModal');
    if (!modal) return;

    modal.classList.remove('is-active');
    modal.setAttribute('aria-hidden', 'true');

    // Release background scroll lock
    document.documentElement.classList.remove('modal-open');
    document.body.classList.remove('modal-open');
    document.body.style.overflow = '';
    document.documentElement.style.overflow = '';
}

function clearSpotlightSearch() {
    const input = document.getElementById('spotlightSearchInput');
    sessionStorage.removeItem('spotlight_last_query');
    if (input) {
        input.value = '';
        input.focus();
        toggleClearButton(false);
        updateBrowseLink('');
        showSpotlightState('initial');
    }
}

window.openSpotlightSearch = openSpotlightSearch;
window.closeSpotlightSearch = closeSpotlightSearch;
window.clearSpotlightSearch = clearSpotlightSearch;

function toggleClearButton(show) {
    const clearBtn = document.getElementById('spotlightClearBtn');
    if (clearBtn) {
        clearBtn.classList.toggle('d-none', !show);
    }
}

function updateBrowseLink(q) {
    const link = document.getElementById('spotlightBrowseLink');
    const textSpan = document.getElementById('spotlightBrowseText');
    if (link) {
        if (q && q.trim().length > 0) {
            const trimmed = q.trim();
            link.href = `{% url 'records_browse' %}?q=${encodeURIComponent(trimmed)}`;
            if (textSpan) {
                const displayQuery = trimmed.length > 22 ? trimmed.substring(0, 20) + '…' : trimmed;
                textSpan.textContent = `View results for "${displayQuery}"`;
            }
        } else {
            link.href = "{% url 'records_browse' %}";
            if (textSpan) {
                textSpan.textContent = 'Browse All Records';
            }
        }
    }
}

function showSpotlightState(state) {
    currentSpotlightState = state;
    const initial = document.getElementById('spotlightInitialState');
    const results = document.getElementById('spotlightResultsList');
    const empty = document.getElementById('spotlightEmptyState');

    if (initial) initial.classList.toggle('d-none', state !== 'initial');
    if (results) results.classList.toggle('d-none', state !== 'results');
    if (empty) empty.classList.toggle('d-none', state !== 'empty');
}

function moveSpotlightSelection(delta) {
    const items = Array.from(document.querySelectorAll('#spotlightResultsList .spotlight-result-item'));
    if (items.length === 0) return;

    items.forEach(el => el.classList.remove('is-selected'));
    spotlightSelectedIndex += delta;

    if (spotlightSelectedIndex < 0) spotlightSelectedIndex = items.length - 1;
    if (spotlightSelectedIndex >= items.length) spotlightSelectedIndex = 0;

    const selectedItem = items[spotlightSelectedIndex];
    if (selectedItem) {
        selectedItem.classList.add('is-selected');
        selectedItem.scrollIntoView({ block: 'nearest' });
    }
}

function handleSpotlightBrowseClick(e) {
    if (e) {
        e.preventDefault();
        e.stopPropagation();
    }
    const input = document.getElementById('spotlightSearchInput');
    const q = input ? input.value.trim() : '';
    closeSpotlightSearch();
    let targetUrl = "{% url 'records_browse' %}";
    if (q) {
        targetUrl += `?q=${encodeURIComponent(q)}`;
    }
    window.location.href = targetUrl;
}
window.handleSpotlightBrowseClick = handleSpotlightBrowseClick;

function triggerSelectedSpotlightItem() {
    if (currentSpotlightState === 'results') {
        const items = document.querySelectorAll('#spotlightResultsList .spotlight-result-item');
        if (items.length > 0) {
            const target = (spotlightSelectedIndex >= 0 && spotlightSelectedIndex < items.length) 
                ? items[spotlightSelectedIndex] 
                : items[0];
            if (target && target.href) {
                closeSpotlightSearch();
                window.location.href = target.href;
                return;
            }
        }
    }

    // Fallback: Browse all records with query
    handleSpotlightBrowseClick();
}

// Global Key Listeners for opening & navigating
document.addEventListener('keydown', function(e) {
    const modal = document.getElementById('spotlightSearchModal');
    const isModalOpen = modal && modal.classList.contains('is-active');

    // Open Shortcut: Ctrl+K or Cmd+K or / (when not typing in form inputs)
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
        e.preventDefault();
        if (isModalOpen) closeSpotlightSearch();
        else openSpotlightSearch();
        return;
    }

    if (e.key === '/' && !isModalOpen) {
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag !== 'input' && tag !== 'textarea' && tag !== 'select' && !e.target.isContentEditable) {
            e.preventDefault();
            openSpotlightSearch();
            return;
        }
    }

    // When modal is active:
    if (isModalOpen) {
        if (e.key === 'Escape') {
            e.preventDefault();
            closeSpotlightSearch();
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            moveSpotlightSelection(1);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            moveSpotlightSelection(-1);
        } else if (e.key === 'Enter') {
            e.preventDefault();
            triggerSelectedSpotlightItem();
        }
    }
});

// Live debounced search query
document.addEventListener('DOMContentLoaded', function() {
    const input = document.getElementById('spotlightSearchInput');
    const spinner = document.getElementById('spotlightSpinner');
    const resultsList = document.getElementById('spotlightResultsList');

    if (input) {
        input.addEventListener('input', function() {
            const q = this.value.trim();
            clearTimeout(spotlightDebounceTimer);
            spotlightSelectedIndex = -1;
            toggleClearButton(this.value.length > 0);
            updateBrowseLink(q);

            if (q.length > 0) {
                sessionStorage.setItem('spotlight_last_query', this.value);
            } else {
                sessionStorage.removeItem('spotlight_last_query');
            }

            if (q.length < 1) {
                if (spinner) spinner.classList.add('d-none');
                showSpotlightState('initial');
                return;
            }

            if (spinner) spinner.classList.remove('d-none');

            spotlightDebounceTimer = setTimeout(() => {
                fetch(`/api/quick-search/?q=${encodeURIComponent(q)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (spinner) spinner.classList.add('d-none');
                        const results = data.results || [];
                        if (results.length === 0) {
                            showSpotlightState('empty');
                            return;
                        }

                        resultsList.innerHTML = '';
                        results.forEach((item, index) => {
                            const a = document.createElement('a');
                            a.href = item.url;
                            a.className = `spotlight-result-item ${index === 0 ? 'is-selected' : ''}`;
                            a.dataset.index = index;
                            
                            const iconClass = item.icon || 'fa-solid fa-file-lines';
                            const themeClass = item.theme_class || 'theme-permit';

                            a.innerHTML = `
                                <div class="spotlight-result-left">
                                    <div class="result-icon-box ${themeClass}">
                                        <i class="${iconClass}"></i>
                                    </div>
                                    <div class="result-text-stack">
                                        <div class="result-main-title">
                                            <span class="result-title-text fw-semibold" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</span>
                                        </div>
                                        <div class="result-sub-meta">
                                            <span class="result-detail-text" title="${escapeHtml(item.meta_subtitle)}">${escapeHtml(item.meta_subtitle)}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="spotlight-result-right">
                                    <span class="result-location-badge">
                                        ${escapeHtml(item.barangay)}
                                    </span>
                                </div>
                            `;
                            
                            a.addEventListener('click', (e) => {
                                e.preventDefault();
                                closeSpotlightSearch();
                                window.location.href = item.url;
                            });

                            a.addEventListener('mouseenter', () => {
                                document.querySelectorAll('#spotlightResultsList .spotlight-result-item').forEach(el => el.classList.remove('is-selected'));
                                a.classList.add('is-selected');
                                spotlightSelectedIndex = index;
                            });

                            resultsList.appendChild(a);
                        });

                        spotlightSelectedIndex = 0;
                        showSpotlightState('results');
                    })
                    .catch(err => {
                        if (spinner) spinner.classList.add('d-none');
                        console.error('Spotlight search error:', err);
                    });
            }, 140);
        });
    }
});

function escapeHtml(text) {
    if (!text) return '';
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
}
