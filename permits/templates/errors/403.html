<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Restricted | eTala</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --card-shadow: 0 16px 36px -8px rgba(15, 23, 42, 0.08);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0b1120;
                --card-bg: #1e293b;
                --text-main: #f8fafc;
                --text-sub: #94a3b8;
                --border-color: #334155;
                --card-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.35);
            }
            .btn-custom-secondary {
                background: #1e293b !important;
                border-color: #334155 !important;
                color: #e2e8f0 !important;
            }
            .btn-custom-secondary:hover {
                background: #334155 !important;
                color: #ffffff !important;
                border-color: #475569 !important;
            }
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            margin: 0;
        }
        .error-card {
            max-width: 480px;
            width: 100%;
            border-radius: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            padding: 2.5rem 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .error-icon-box {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: rgba(217, 119, 6, 0.12);
            color: #d97706;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
            font-size: 1.85rem;
        }
        .error-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }
        .error-desc {
            color: var(--text-sub);
            font-size: 0.88rem;
            line-height: 1.55;
            max-width: 380px;
            margin: 0 auto 1.75rem auto;
        }

        /* ── Unified Button Styles ── */
        .btn-custom-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 40px;
            padding: 0 18px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff !important;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            text-decoration: none;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-custom-primary:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
            transform: translateY(-1px);
        }
        .btn-custom-primary i {
            font-size: 13.5px;
        }

        .btn-custom-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 40px;
            padding: 0 18px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-custom-secondary:hover {
            background: #f8fafc;
            color: #1e293b;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }
        .btn-custom-secondary i {
            font-size: 13.5px;
            color: #64748b;
        }

        .footer-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            font-size: 0.76rem;
            color: var(--text-sub);
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border-color);
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon-box">
            <i class="fa-solid fa-lock"></i>
        </div>
        
        <h1 class="error-title">Access Restricted (403)</h1>
        <p class="error-desc">
            You do not have the required permissions to view or edit this section. Please contact the administrator if you believe this is an error.
        </p>

        <div class="d-flex flex-wrap gap-2.5 justify-content-center align-items-center w-100" style="gap: 10px;">
            <a href="/dashboard/" class="btn-custom-primary">
                <i class="fa-solid fa-house"></i>
                <span>Go to Dashboard</span>
            </a>
            <button onclick="window.history.back()" class="btn-custom-secondary">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Go Back</span>
            </button>
        </div>

        <div class="footer-badge">
            <i class="fa-solid fa-shield-halved text-primary"></i>
            <span>eTala &bull; Municipal Engineering Office of Carigara</span>
        </div>
    </div>
</body>
</html>
