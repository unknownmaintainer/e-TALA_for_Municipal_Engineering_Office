databases:
  - name: etala-db
    databaseName: etala_db
    user: etala_user
    plan: free

services:
  - type: web
    name: etala-web
    env: python
    plan: free
    buildCommand: "bash build.sh"
    preDeployCommand: "python manage.py migrate && python manage.py seed_requirement_templates"
    startCommand: "python manage.py axes_reset && gunicorn etala_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: etala-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: "False"
      # These must be set manually in the Render dashboard:
      # - key: ALLOWED_HOSTS
      #   value: "your-app.onrender.com"
      # - key: CSRF_TRUSTED_ORIGINS
      #   value: "https://your-app.onrender.com"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_NAME
        value: "etala-documents"
      - key: EMAIL_HOST
        value: "smtp-relay.brevo.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "Municipal Engineering Office - Carigara <mardionjrcordetafuerte2@gmail.com>"


